<!DOCTYPE html>
<!--
  Folder layout:

  index.html
  style.css
  script.js
  fonts/SpaceMono-Regular.ttf     <- download from Google Fonts
  covers/cow.png ...              <- your album covers (square images work best)
-->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nick Jasper</title>
    <meta name="description" content="Official website of Nick Jasper: musician, author, indie game developer, CEO of Lebbex, and creator of Arrel.">
    <meta property="og:title" content="Nick Jasper">
    <meta property="og:description" content="Official website of Nick Jasper.">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>

<body>
    <!-- Cursor filter (used by .cursor in style.css):
         greyscale -> threshold at 50% -> grow the bright pixels by 1px in every direction -> invert.
         So a lone white pixel on black becomes a 3x3 black square on white inside the ring. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <filter id="cursor-filter" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix"
                values="0.2126 0.7152 0.0722 0 0
                        0.2126 0.7152 0.0722 0 0
                        0.2126 0.7152 0.0722 0 0
                        0      0      0      1 0" />
            <feComponentTransfer>
                <feFuncR type="discrete" tableValues="0 1" />
                <feFuncG type="discrete" tableValues="0 1" />
                <feFuncB type="discrete" tableValues="0 1" />
            </feComponentTransfer>
            <feMorphology operator="dilate" radius="1" />
            <feComponentTransfer>
                <feFuncR type="table" tableValues="1 0" />
                <feFuncG type="table" tableValues="1 0" />
                <feFuncB type="table" tableValues="1 0" />
            </feComponentTransfer>
        </filter>
    </svg>

    <div class="cursor" id="cursor" aria-hidden="true"></div>

    <header class="hero">
        <h1 class="title" aria-label="NICK JASPER">
            <span class="nick" aria-hidden="true">NICK</span>
            <span class="name" aria-hidden="true">
                <span class="line">JAS</span>
                <span class="line">PER</span>
            </span>
        </h1>
    </header>

    <main>
        <section class="discography" aria-label="Discography">
            <div class="side-probe" id="side-probe" aria-hidden="true"></div>

            <div class="categories" id="categories">
                <!-- Copy/paste one <a class="album"> per album. Change href, img src and title.
                     Copy a whole <section class="category"> to add a category. -->
                <section class="category" aria-labelledby="cat-personal">
                    <h2 class="cat-title" id="cat-personal">SELF RELEASE</h2>
                    <div class="carousel" data-carousel>
                        <button class="arrow arrow-prev" type="button" data-dir="-1" aria-label="Scroll left"
                            disabled>&lt;</button>
                        <div class="scroller">
                            <div class="track">

                                <a class="album" data-fade="card"
                                    href="https://soundcloud.com/nickjas/sets/s-n"
                                    target="_blank" rel="noopener">
                                    <div class="cover"><img src="covers/sunday-nights.png" alt="" draggable="false"></div>
                                    <p class="album-title">Sunday Nights</p>
                                </a>

                                <a class="album" data-fade="card"
                                    href="https://youtube.com/watch?v=95Vt00onysI&list=PLJrzrdM2WSXKXzhorP7A3yFC8lXLPzHgE"
                                    target="_blank" rel="noopener">
                                    <div class="cover"><img src="covers/the-cow-that-jumped-over-the-moon-and-killed-the-rat.png" 
                                        alt="" draggable="false"></div>
                                    <p class="album-title">The cow that jumped over the moon and killed the rat</p>
                                </a>

                                <a class="album" data-fade="card"
                                    href="https://youtube.com/watch?v=jyHPsgV9p6w&list=PLJrzrdM2WSXJ7EXILNpxLMrXTTR95toSh"
                                    target="_blank" rel="noopener">
                                    <div class="cover"><img src="covers/interlude.png" alt="" draggable="false"></div>
                                    <p class="album-title">.&nbsp;&nbsp;I И T E R L U D E&nbsp;&nbsp;.</p>
                                </a>
                            </div>
                        </div>
                        <button class="arrow arrow-next" type="button" data-dir="1" aria-label="Scroll right"
                            disabled>&gt;</button>
                    </div>
                </section>

                <section class="category" aria-labelledby="cat-arrel">
                    <h2 class="cat-title" id="cat-arrel">ARREL OST</h2>
                    <div class="carousel" data-carousel>
                        <button class="arrow arrow-prev" type="button" data-dir="-1" aria-label="Scroll left"
                            disabled>&lt;</button>
                        <div class="scroller">
                            <div class="track">
                                <a class="album" data-fade="card"
                                    href="https://youtube.com/watch?v=JaP1nz73gEE&list=PLEWeFT0ctV_Y" target="_blank"
                                    rel="noopener">
                                    <div class="cover"><img src="covers/indev.png" alt="" draggable="false"></div>
                                    <p class="album-title">Volume Indev</p>
                                </a>
                            </div>
                        </div>
                        <button class="arrow arrow-next" type="button" data-dir="1" aria-label="Scroll right"
                            disabled>&gt;</button>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <footer class="links">
        <p>©2026-NICK-JASPER</p>
        <a class="link" data-fade="link" href="https://youtube.com/@NickJasper" target="_blank"
            rel="noopener">YOUTUBE</a>
        <a class="link" data-fade="link" href="https://x.com/NickJasperr" target="_blank" 
            rel="noopener">X</a>
        <a class="link" data-fade="link" href="https://github.com/nickjasperr" target="_blank"
            rel="noopener">GITHUB</a>
        <a class="link" data-fade="link" href="https://instagram.com/nickjasperr" target="_blank"
            rel="noopener">INSTA</a>
        <a class="link" data-fade="link" href="https://bsky.app/profile/nickjasper.bsky.social" target="_blank"
            rel="noopener">BSKY</a>
        <a class="link" data-fade="link" href="https://lebbex.com" target="_blank"
            rel="noopener">LEBBEX™</a>
    </footer>

    <!-- Lenis (pinned version). Site still works with native scrolling if this fails to load. -->
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="script.js"></script>
    <script>document.title = "\u2800";</script>
</body>

</html>
